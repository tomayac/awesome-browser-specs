<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Awesome Browser Specs</title>
    <meta
      name="description"
      content="A demoscene production about every browser spec: live data from browser-specs.github.io, a dubstep soundtrack synthesized in the browser, and robot voices."
    />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=IBM+Plex+Mono:wght@500;700&display=swap"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="stage"></div>

    <div id="start">
      <h1 class="title">Awesome<br />Browser Specs</h1>
      <p class="sub">A demo about every spec the web runs on</p>
      <p id="status" class="status" role="status">Loading specs…</p>
      <div class="actions">
        <button id="play" class="go" type="button" disabled>Play</button>
        <button id="play-full" class="go" type="button" disabled>
          Play full screen
        </button>
      </div>
      <p class="note">
        Sound and robot voices on · flashing lights · 1–8 jump to a part · space
        pauses · M mutes · F or a double-click toggles full screen
      </p>
    </div>

    <div id="hud">
      <span id="hud-part" aria-hidden="true"></span>
      <span class="hud-end">
        <span id="hud-clock" aria-hidden="true"></span>
        <button id="fullscreen" type="button">Full screen</button>
      </span>
    </div>
    <div id="scrubber" title="Click to seek">
      <div id="progress"></div>
    </div>
  </body>
</html>
